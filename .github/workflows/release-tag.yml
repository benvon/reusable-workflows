name: release-tag

on:
  workflow_call:
    inputs:
      base_branch:
        required: false
        type: string
        default: main
      caller_event_name:
        required: true
        type: string
      caller_sha:
        required: true
        type: string
      manual_release_type:
        required: false
        type: string
        default: ""
    outputs:
      should_release:
        description: Whether downstream publication should run, including retries of an existing tag.
        value: ${{ jobs.release-tag.outputs.should_release }}
      tag:
        description: The new or existing release tag.
        value: ${{ jobs.release-tag.outputs.tag }}
      sha:
        description: The target commit SHA supplied by the caller.
        value: ${{ jobs.release-tag.outputs.sha }}
      created:
        description: Whether this successful run created the tag.
        value: ${{ jobs.release-tag.outputs.created }}

jobs:
  release-tag:
    name: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: reusable-release-tags
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: read
    outputs:
      should_release: ${{ steps.signal.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ inputs.caller_sha }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release signal
        id: signal
        uses: actions/github-script@v8
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          CALLER_EVENT_NAME: ${{ inputs.caller_event_name }}
          CALLER_SHA: ${{ inputs.caller_sha }}
          MANUAL_RELEASE_TYPE: ${{ inputs.manual_release_type }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelsToBump = {
              "release:major": "major",
              "release:minor": "minor",
              "release:patch": "patch",
            };
            const skipLabels = new Set(["release:none", "release:skip"]);
            const eventName = process.env.CALLER_EVENT_NAME;
            const sha = process.env.CALLER_SHA;
            const baseBranch = process.env.BASE_BRANCH;
            let bump = (process.env.MANUAL_RELEASE_TYPE || "").trim();
            let source = "";

            if (eventName === "push") {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });

              const mergedPr = prs.find((pr) => pr.merged_at && pr.base.ref === baseBranch);
              if (!mergedPr) {
                core.notice(`No merged pull request is associated with ${sha}; skipping release.`);
                core.setOutput("should_release", "false");
                return;
              }

              const labels = mergedPr.labels.map((label) =>
                typeof label === "string" ? label : label.name,
              );
              const matched = labels.filter((name) => Object.prototype.hasOwnProperty.call(labelsToBump, name));
              const skips = labels.filter((name) => skipLabels.has(name));

              if (matched.length > 1) {
                core.setFailed(`PR #${mergedPr.number} has multiple release labels: ${matched.join(", ")}`);
                return;
              }

              if (skips.length > 0 && matched.length > 0) {
                core.setFailed(`PR #${mergedPr.number} mixes skip and release labels: ${[...skips, ...matched].join(", ")}`);
                return;
              }

              if (skips.length > 0) {
                core.notice(`PR #${mergedPr.number} has ${skips.join(", ")}; skipping release.`);
                core.setOutput("should_release", "false");
                return;
              }

              if (matched.length === 0) {
                core.notice(`PR #${mergedPr.number} is missing a release label; skipping release.`);
                core.setOutput("should_release", "false");
                return;
              }

              bump = labelsToBump[matched[0]];
              source = `PR #${mergedPr.number} label ${matched[0]}`;
              core.setOutput("pr_number", String(mergedPr.number));
              core.setOutput("pr_title", mergedPr.title);
            } else if (eventName === "workflow_dispatch") {
              if (!["major", "minor", "patch"].includes(bump)) {
                core.setFailed(`Manual release_type must be one of major, minor, or patch. Received: '${bump}'.`);
                return;
              }
              source = `workflow_dispatch input ${bump}`;
            } else {
              core.notice(`Unsupported caller event '${eventName}'; skipping release.`);
              core.setOutput("should_release", "false");
              return;
            }

            core.setOutput("should_release", "true");
            core.setOutput("bump", bump);
            core.setOutput("source", source);

      - name: Skip release when no release label is present
        if: steps.signal.outputs.should_release != 'true'
        run: echo "No release action taken for this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Allocate release tag
        if: steps.signal.outputs.should_release == 'true'
        id: version
        env:
          RELEASE_SHA: ${{ inputs.caller_sha }}
          RELEASE_BUMP: ${{ steps.signal.outputs.bump }}
          RELEASE_SOURCE: ${{ steps.signal.outputs.source }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          bump = os.environ["RELEASE_BUMP"]
          if bump not in ("major", "minor", "patch"):
              sys.exit(f"Unsupported release bump: {bump}")
          target = git("rev-parse", "--verify", "--end-of-options", os.environ["RELEASE_SHA"] + "^{commit}")
          stable = re.compile(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
          namespace = "refs/release-tags/"

          def complete(tag, created):
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                  output.write(f"tag={tag}\ncreated={str(created).lower()}\n")
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(f"Release source: {os.environ['RELEASE_SOURCE']}\n")
                  summary.write(f"{'Created' if created else 'Reusing'} {tag} for {target}\n")

          for attempt in range(1, 6):
              # Refresh after entering the queue, and again after any push conflict.
              # A separate namespace also removes deleted remote tags without touching local tags.
              git("fetch", "--no-tags", "--prune", "origin", f"+refs/tags/*:{namespace}*")
              versions = []
              existing = []
              for ref in git("for-each-ref", "--format=%(refname)", namespace).splitlines():
                  tag = ref.removeprefix(namespace)
                  match = stable.fullmatch(tag)
                  if not match:
                      continue
                  version = tuple(int(part) for part in match.groups())
                  versions.append((version, tag))
                  if git("rev-parse", "--verify", ref + "^{commit}") == target:
                      existing.append((version, tag))
              if existing:
                  complete(max(existing)[1], False)
                  break

              major, minor, patch = max(versions, default=((0, 0, 0), ""))[0]
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              tag = f"v{major}.{minor}.{patch}"
              # A normal push atomically creates the ref and never overwrites an existing tag.
              push = subprocess.run(["git", "push", "--porcelain", "origin", f"{target}:refs/tags/{tag}"],
                                    text=True, capture_output=True)
              if push.returncode == 0:
                  complete(tag, any(line.startswith("*\t") for line in push.stdout.splitlines()))
                  break
              sys.stderr.write(push.stderr)
              # Retry a real ref collision only; do not hide auth, hook, or service failures.
              if not git("ls-remote", "--refs", "origin", f"refs/tags/{tag}"):
                  sys.exit(f"Push of {tag} failed without a competing tag; no release allocated.")
              if attempt == 5:
                  sys.exit("Release allocation conflicted five times; rerun this workflow to recover.")
              print(f"Tag {tag} was claimed concurrently; refreshing before retry {attempt + 1}.")
              time.sleep(attempt)
          PY
