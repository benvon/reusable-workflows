name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install workflow linters
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3
        with:
          version: 2026.11.2
          tool_versions: |
            actionlint 1.7.12
            shellcheck 0.11.0

      - name: Run actionlint
        run: actionlint

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check yamllint==1.37.1

      - name: Lint YAML
        run: yamllint .

      - name: Run workflow regression tests
        run: python -m unittest discover -s tests -v
