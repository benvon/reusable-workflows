name: publish-release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing tag to publish, supplied by the release-tag workflow.
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        with:
          script: |
            const repository = context.repo;
            const tag = process.env.RELEASE_TAG;

            // Preserve --verify-tag behavior: never create a tag as a side effect.
            await github.rest.git.getRef({ ...repository, ref: `tags/${tag}` });

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...repository,
                tag,
              });
              core.notice(`Release ${tag} already exists: ${release.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const { data: release } = await github.rest.repos.createRelease({
              ...repository,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            });
            core.notice(`Published ${release.html_url}`);
